<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDLC Standards Blueprint Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }
        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding-left: 1.5rem;
        }
        .sidebar-item.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border-right: 4px solid var(--accent);
        }
        .markdown-body {
            line-height: 1.6;
        }
        .markdown-body h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; color: #7dd3fc; }
        .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #bae6fd; }
        .markdown-body p { margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-body li { margin-bottom: 0.5rem; }
        .markdown-body code { background: rgba(0,0,0,0.3); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; color: #f472b6; }
        .markdown-body pre { background: #000; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #334155; }
        .markdown-body blockquote { border-left: 4px solid var(--accent); padding-left: 1rem; color: var(--text-dim); font-style: italic; margin: 1.5rem 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.75rem; text-align: left; }
        .markdown-body th { background: rgba(56, 189, 248, 0.05); color: var(--accent); }

        /* Copy Button */
        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }
        .copy-btn:hover { background: var(--accent); color: white; }
        .markdown-body pre, .markdown-body blockquote { position: relative; }
        .markdown-body pre:hover .copy-btn, .markdown-body blockquote:hover .copy-btn { opacity: 1; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 flex items-center justify-between px-8 glass z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-sky-500/20">S</div>
            <h1 class="text-xl font-bold tracking-tight">SDLC Standards <span class="text-sky-400 font-medium">Blueprint v1.0</span></h1>
        </div>
        <div class="text-sm text-slate-400 font-medium">
            Project Director Panel
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 glass flex flex-col border-r border-white/5 z-10">
            <div class="p-6 pb-2 text-xs font-bold text-slate-500 uppercase tracking-widest">Reading Order</div>
            <nav id="nav-list" class="flex-1 overflow-y-auto py-2">
                <button onclick="loadFile('README.md', this)" class="sidebar-item active w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">01</span> README Overview
                </button>
                <button onclick="loadFile('SDLC_MAP_V1.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">02</span> SDLC Roadmap Map
                </button>
                <button onclick="loadFile('SDLC_PHASES_STEP_BY_STEP.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">03</span> Step-by-Step Guide
                </button>
                <button onclick="loadFile('STANDARD_DEVELOPMENT_GUIDE_V1.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">04</span> Development Guide
                </button>
                <button onclick="loadFile('DIRECTOR_GOVERNANCE_RULES.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">05</span> Governance Rules
                </button>
                <button onclick="loadFile('07_QUALITY_GATES_DOD.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">06</span> Quality Gates (DoD)
                </button>
                <button onclick="loadFile('08_PORT_REGISTRY.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">07</span> Port Registry
                </button>
                <button onclick="loadFile('09_AI_TROUBLESHOOTING_GUIDE.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">08</span> AI Troubleshooting
                </button>
                <button onclick="loadFile('PROJECT_INITIALIZATION_PROMPT.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">09</span> Init Prompt (Copy)
                </button>

                <div class="p-6 pb-2 mt-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Tools</div>
                <button onclick="showBriefForm()" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">B1</span> Project Brief Form
                </button>
                <button onclick="loadFile('bootstrap_project.sh', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">B2</span> Bootstrap Script (Code)
                </button>

                <div class="p-6 pb-2 mt-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Templates</div>
                <button onclick="loadFile('templates/00_0_START_HERE.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">T1</span> Start Here Rule
                </button>
                <button onclick="loadFile('templates/01_PLAYBOOK_RULES_V2.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">T2</span> Playbook Rules
                </button>
                <button onclick="loadFile('templates/AGENTS.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">T3</span> RBAC Standard
                </button>
                <button onclick="loadFile('templates/REQUIREMENT_TEMPLATE.md', this)" class="sidebar-item w-full text-left px-8 py-3 flex items-center gap-3 text-sm font-medium">
                    <span class="w-5 text-slate-500">T4</span> Requirement Spec
                </button>
            </nav>
            <div class="p-6 glass mt-auto border-t border-white/5">
                <div class="flex items-center gap-3 text-xs text-slate-400">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    Standard SDLC v1.0 Ready
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-12 bg-slate-900/50">
            <div id="content-area" class="max-w-4xl mx-auto markdown-body animate-fade">
                <!-- Initial content will be loaded here -->
            </div>
        </main>
    </div>

    <script>
        // Setup marked options
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: true,
            mangle: false
        });

        async function loadFile(fileName, element) {
            if (element) {
                document.querySelectorAll('.sidebar-item').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
            }

            const contentArea = document.getElementById('content-area');
            contentArea.style.opacity = '0';
            
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('File not found');
                const markdown = await response.text();
                
                const html = marked.parse(markdown);
                const cleanHTML = DOMPurify.sanitize(html);
                contentArea.innerHTML = cleanHTML;

                // Post-process links
                contentArea.querySelectorAll('a').forEach(link => {
                    link.setAttribute('target', '_blank');
                    link.setAttribute('rel', 'noopener noreferrer');
                    link.classList.add('text-sky-400', 'hover:underline');
                });

                // Post-process copy buttons
                contentArea.querySelectorAll('blockquote, pre').forEach(block => {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerText = 'Copy';
                    btn.onclick = () => {
                        const text = block.innerText.replace('Copy', '').trim();
                        navigator.clipboard.writeText(text);
                        btn.innerText = 'Copied!';
                        setTimeout(() => btn.innerText = 'Copy', 2000);
                    };
                    block.appendChild(btn);
                });
            } catch (error) {
                contentArea.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/50 p-8 rounded-xl text-center text-red-400">
                        เกิดข้อผิดพลาดในการโหลดไฟล์: ${fileName}
                    </div>`;
            } finally {
                setTimeout(() => contentArea.style.opacity = '1', 50);
            }
        }

        function showBriefForm() {
            document.querySelectorAll('.sidebar-item').forEach(btn => btn.classList.remove('active'));
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="animate-fade">
                    <h1 class="text-3xl font-bold mb-6 text-sky-400">Project Brief Generator</h1>
                    <div class="space-y-6 bg-slate-800/50 p-8 rounded-2xl border border-white/5">
                        <div>
                            <label class="block text-sm font-bold text-sky-300 mb-2">ชื่อโครงการ</label>
                            <input type="text" id="p-name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-sky-300 mb-2">เป้าหมายหลัก</label>
                            <textarea id="p-obj" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-sky-300 mb-2">ฟีเจอร์ที่ต้องการ</label>
                            <textarea id="p-feat" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-sky-300 mb-2">กฎเหล็ก/ข้อจำกัด</label>
                            <textarea id="p-rules" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none"></textarea>
                        </div>
                        <button onclick="generateIntent()" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                            Generate Owner Intent & Prompt
                        </button>
                    </div>
                    <div id="result-area" class="mt-12 hidden">
                        <div class="relative group">
                            <pre id="intent-code" class="bg-black p-6 rounded-xl border border-sky-500/30 overflow-x-auto text-sm text-slate-300"></pre>
                            <button onclick="copyGenerated()" class="absolute top-4 right-4 bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg">Copy to Clipboard</button>
                        </div>
                    </div>
                </div>`;
        }

        function generateIntent() {
            const name = document.getElementById('p-name').value || '[ชื่อโครงการ]';
            const obj = document.getElementById('p-obj').value || '[เป้าหมาย]';
            const feat = document.getElementById('p-feat').value || '[ฟีเจอร์]';
            const rules = document.getElementById('p-rules').value || '[กฎเหล็ก]';
            const output = `# **Owner Intent: ${name}**\n\n## **1. เป้าหมาย**\n${obj}\n\n## **2. ฟีเจอร์**\n${feat.split('\n').map(f => `- ${f}`).join('\n')}\n\n## **3. กฎและข้อจำกัด**\n- ยึดตามมาตรฐาน SDLC v1.0\n${rules.split('\n').map(r => `- ${r}`).join('\n')}\n\n---\n**AI Action Prompt:**\n"ฉันได้ร่าง Owner Intent เรียบร้อยแล้ว โปรดอ่านและวิเคราะห์เพื่อวางแผน Roadmap ในเฟส Planning (Phase 1) ให้ฉันหน่อย โดยยึดหลักการทำงานแบบ SDLC v1.0"`;
            document.getElementById('intent-code').innerText = output;
            document.getElementById('result-area').classList.remove('hidden');
        }

        function copyGenerated() {
            navigator.clipboard.writeText(document.getElementById('intent-code').innerText);
            alert('คัดลอกเรียบร้อยแล้ว!');
        }

        window.addEventListener('DOMContentLoaded', () => loadFile('README.md'));
    </script>
</body>
</html>
